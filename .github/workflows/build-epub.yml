name: Build EPUB

on:
  workflow_dispatch:
    inputs:
      language:
        description: "EPUB language"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - jp
          - zh

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pandoc and Python dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Build EPUB
        run: |
          python tools/epub/build_epub.py --lang "${{ inputs.language }}"

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPCA-PCN-EPUB
          path: dist/*.epub
          if-no-files-found: error
          retention-days: 30
