{{/* Place at layouts/shortcodes/pcn-animation.html */}}
<link rel="stylesheet" href="{{ "css/pcn-animation.css" | relURL }}">

<div class="pcn3" data-pcn3>
  <div class="pcn3__toolbar">
    <div class="pcn3__title">PCN执行示意动图</div>
    <div class="pcn3__controls" aria-label="动画控制">
      <div class="pcn3__mode" role="group" aria-label="播放模式">
        <button class="pcn3__control is-selected" type="button" data-pcn3-auto aria-pressed="true">自动循环</button>
        <button class="pcn3__control" type="button" data-pcn3-manual aria-pressed="false">手动</button>
      </div>
      <div class="pcn3__stepnav" role="group" aria-label="状态前后切换">
        <button class="pcn3__control" type="button" data-pcn3-prev aria-label="上一个状态">← 上一步</button>
        <span class="pcn3__counter" data-pcn3-counter aria-live="polite">1 / 8</span>
        <button class="pcn3__control" type="button" data-pcn3-next aria-label="下一个状态">下一步 →</button>
      </div>
    </div>
  </div>

  <div class="pcn3__frame">
    <svg class="pcn3__svg" viewBox="0 0 1200 720" role="img" aria-labelledby="pcn3Title pcn3Desc">
      <title id="pcn3Title">PCN执行示意动图</title>
      <desc id="pcn3Desc">
        多源设备与系统信号进入 PCN，在 PCN 内部映射为 C、A、E 三个变量域，
        再通过 S、D、B 三类判定性质形成九个 CAE-SDB 判定坐标。
        一个或多个判定坐标被触发后进入 Arbitration，并选择相应执行路径。
        示例先触发 E-D，进入 Wait / Refresh；状态刷新后重新判定，进入正常执行链并到达 Target State。
      </desc>

      <!-- ===== Header zones ===== -->
      <text x="72" y="44" class="pcn3-zone">多源设备 / 系统信号</text>
      <text x="430" y="44" class="pcn3-zone">PCN：CAE-SDB 判定</text>
      <text x="910" y="44" class="pcn3-zone">执行路径 / Target State</text>

      <!-- ===== LEFT: source signals ===== -->
      <g class="pcn3-sources" data-part="sources">
        <g class="pcn3-source" data-src="vision">
          <rect x="50" y="90" width="220" height="48" rx="12"/>
          <text x="160" y="120" text-anchor="middle">Vision_Result</text>
        </g>
        <g class="pcn3-source" data-src="work">
          <rect x="50" y="152" width="220" height="48" rx="12"/>
          <text x="160" y="182" text-anchor="middle">Work_Order / Task</text>
        </g>
        <g class="pcn3-source" data-src="safety">
          <rect x="50" y="214" width="220" height="48" rx="12"/>
          <text x="160" y="244" text-anchor="middle">Safety_Permit</text>
        </g>
        <g class="pcn3-source" data-src="quality">
          <rect x="50" y="276" width="220" height="48" rx="12"/>
          <text x="160" y="306" text-anchor="middle">Quality_Release</text>
        </g>
        <g class="pcn3-source" data-src="robot">
          <rect x="50" y="338" width="220" height="48" rx="12"/>
          <text x="160" y="368" text-anchor="middle">Robot_Ready</text>
        </g>
        <g class="pcn3-source" data-src="downstream">
          <rect x="50" y="400" width="220" height="48" rx="12"/>
          <text x="160" y="430" text-anchor="middle">Downstream_Available</text>
        </g>
      </g>

      <!-- Signal flow into PCN -->
      <path class="pcn3-flow pcn3-flow--signal" data-line="sig1" d="M270 114 C320 114 330 150 370 150"/>
      <path class="pcn3-flow pcn3-flow--signal" data-line="sig2" d="M270 176 C320 176 330 185 370 185"/>
      <path class="pcn3-flow pcn3-flow--signal" data-line="sig3" d="M270 238 C320 238 330 220 370 220"/>
      <path class="pcn3-flow pcn3-flow--signal" data-line="sig4" d="M270 300 C320 300 330 255 370 255"/>
      <path class="pcn3-flow pcn3-flow--signal" data-line="sig5" d="M270 362 C320 362 330 290 370 290"/>
      <path class="pcn3-flow pcn3-flow--signal" data-line="sig6" d="M270 424 C320 424 330 325 370 325"/>

      <!-- ===== CENTER: PCN box ===== -->
      <g class="pcn3-pcn" data-part="pcn">
        <rect x="370" y="82" width="450" height="520" rx="22"/>
        <text x="595" y="118" text-anchor="middle" class="pcn3-pcn__title">PCN</text>
        <text x="595" y="142" text-anchor="middle" class="pcn3-pcn__sub">Pre-Control Node</text>
      </g>

      <!-- CAE mapping -->
      <g class="pcn3-cae" data-part="cae">
        <rect x="405" y="160" width="380" height="128" rx="14"/>
        <text x="595" y="184" text-anchor="middle" class="pcn3-section-title">C / A / E Mapping</text>

        <g class="pcn3-domain" data-domain="c">
          <rect x="425" y="202" width="104" height="62" rx="12"/>
          <text x="477" y="226" text-anchor="middle" class="pcn3-domain__key">C</text>
          <text x="477" y="247" text-anchor="middle" class="pcn3-domain__label">Condition</text>
        </g>
        <g class="pcn3-domain" data-domain="a">
          <rect x="543" y="202" width="104" height="62" rx="12"/>
          <text x="595" y="226" text-anchor="middle" class="pcn3-domain__key">A</text>
          <text x="595" y="247" text-anchor="middle" class="pcn3-domain__label">Authority</text>
        </g>
        <g class="pcn3-domain" data-domain="e">
          <rect x="661" y="202" width="104" height="62" rx="12"/>
          <text x="713" y="226" text-anchor="middle" class="pcn3-domain__key">E</text>
          <text x="713" y="247" text-anchor="middle" class="pcn3-domain__label">Execution Chain</text>
        </g>

        <!-- mapping tags -->
        <text x="477" y="281" text-anchor="middle" class="pcn3-maptext" data-maptext="c">Vision / Work Order</text>
        <text x="595" y="281" text-anchor="middle" class="pcn3-maptext" data-maptext="a">Safety / Quality</text>
        <text x="713" y="281" text-anchor="middle" class="pcn3-maptext" data-maptext="e">Robot / Downstream</text>
      </g>

      <!-- ===== 3x3 CAE-SDB matrix ===== -->
      <g class="pcn3-matrix" data-part="matrix">
        <rect x="405" y="316" width="380" height="238" rx="14" class="pcn3-matrix__panel"/>
        <text x="595" y="342" text-anchor="middle" class="pcn3-section-title">CAE × SDB</text>

        <text x="464" y="372" text-anchor="middle" class="pcn3-matrix__head">Domain</text>
        <text x="548" y="372" text-anchor="middle" class="pcn3-matrix__head">S</text>
        <text x="632" y="372" text-anchor="middle" class="pcn3-matrix__head">D</text>
        <text x="716" y="372" text-anchor="middle" class="pcn3-matrix__head">B</text>

        <text x="464" y="416" text-anchor="middle" class="pcn3-matrix__row">C</text>
        <text x="464" y="466" text-anchor="middle" class="pcn3-matrix__row">A</text>
        <text x="464" y="516" text-anchor="middle" class="pcn3-matrix__row">E</text>

        <!-- row C -->
        <g class="pcn3-cell" data-cell="C-S">
          <rect x="510" y="388" width="76" height="40" rx="9"/>
          <text x="548" y="414" text-anchor="middle">C-S</text>
        </g>
        <g class="pcn3-cell" data-cell="C-D">
          <rect x="594" y="388" width="76" height="40" rx="9"/>
          <text x="632" y="414" text-anchor="middle">C-D</text>
        </g>
        <g class="pcn3-cell" data-cell="C-B">
          <rect x="678" y="388" width="76" height="40" rx="9"/>
          <text x="716" y="414" text-anchor="middle">C-B</text>
        </g>

        <!-- row A -->
        <g class="pcn3-cell" data-cell="A-S">
          <rect x="510" y="438" width="76" height="40" rx="9"/>
          <text x="548" y="464" text-anchor="middle">A-S</text>
        </g>
        <g class="pcn3-cell" data-cell="A-D">
          <rect x="594" y="438" width="76" height="40" rx="9"/>
          <text x="632" y="464" text-anchor="middle">A-D</text>
        </g>
        <g class="pcn3-cell" data-cell="A-B">
          <rect x="678" y="438" width="76" height="40" rx="9"/>
          <text x="716" y="464" text-anchor="middle">A-B</text>
        </g>

        <!-- row E -->
        <g class="pcn3-cell" data-cell="E-S">
          <rect x="510" y="488" width="76" height="40" rx="9"/>
          <text x="548" y="514" text-anchor="middle">E-S</text>
        </g>
        <g class="pcn3-cell" data-cell="E-D">
          <rect x="594" y="488" width="76" height="40" rx="9"/>
          <text x="632" y="514" text-anchor="middle">E-D</text>
        </g>
        <g class="pcn3-cell" data-cell="E-B">
          <rect x="678" y="488" width="76" height="40" rx="9"/>
          <text x="716" y="514" text-anchor="middle">E-B</text>
        </g>

        <text x="595" y="545" text-anchor="middle" class="pcn3-matrix__note" data-matrix-note>
          Active result set: none
        </text>
      </g>

      <!-- Result explanation -->
      <g class="pcn3-result" data-part="result">
        <rect x="842" y="104" width="300" height="86" rx="14"/>
        <text x="992" y="130" text-anchor="middle" class="pcn3-result__title">CAE-SDB Result</text>
        <text x="992" y="157" text-anchor="middle" class="pcn3-result__code" data-result-code>E-D</text>
        <text x="992" y="179" text-anchor="middle" class="pcn3-result__desc" data-result-desc>Downstream state not refreshed</text>
      </g>

      <path class="pcn3-flow" data-line="matrix_to_result" d="M785 436 C820 436 816 147 842 147"/>

      <!-- Arbitration -->
      <g class="pcn3-arb" data-part="arb">
        <rect x="842" y="220" width="300" height="72" rx="14"/>
        <text x="992" y="247" text-anchor="middle" class="pcn3-arb__title">Arbitration</text>
        <text x="992" y="274" text-anchor="middle" class="pcn3-arb__choice" data-arb-choice>Wait / Refresh</text>
      </g>

      <path class="pcn3-flow" data-line="result_to_arb" d="M992 190 V220"/>

      <!-- paths -->
      <g class="pcn3-path" data-path="wait">
        <rect x="842" y="326" width="138" height="48" rx="12"/>
        <text x="911" y="356" text-anchor="middle">Wait / Refresh</text>
      </g>

      <g class="pcn3-path" data-path="recheck">
        <rect x="1004" y="326" width="138" height="48" rx="12"/>
        <text x="1073" y="356" text-anchor="middle">Recheck</text>
      </g>

      <g class="pcn3-path" data-path="manual">
        <rect x="842" y="392" width="138" height="48" rx="12"/>
        <text x="911" y="422" text-anchor="middle">Manual Confirm</text>
      </g>

      <g class="pcn3-path" data-path="prohibit">
        <rect x="1004" y="392" width="138" height="48" rx="12"/>
        <text x="1073" y="422" text-anchor="middle">Prohibit</text>
      </g>

      <g class="pcn3-path pcn3-path--normal" data-path="normal">
        <rect x="890" y="476" width="204" height="58" rx="13"/>
        <text x="992" y="501" text-anchor="middle" class="pcn3-path__title">Normal Execution Chain</text>
        <text x="992" y="522" text-anchor="middle" class="pcn3-path__sub">Target execution path</text>
      </g>

      <path class="pcn3-flow" data-line="arb_to_wait" d="M950 292 C940 310 930 314 911 326"/>
      <path class="pcn3-flow" data-line="arb_to_recheck" d="M1034 292 C1045 309 1055 313 1073 326"/>
      <path class="pcn3-flow" data-line="arb_to_manual" d="M930 292 C900 330 902 368 911 392"/>
      <path class="pcn3-flow" data-line="arb_to_prohibit" d="M1054 292 C1084 330 1082 368 1073 392"/>
      <path class="pcn3-flow" data-line="arb_to_normal" d="M992 292 V476"/>

      <!-- Target State -->
      <g class="pcn3-target" data-part="target">
        <rect x="890" y="572" width="204" height="76" rx="15"/>
        <text x="992" y="599" text-anchor="middle" class="pcn3-target__title">Target State</text>
        <text x="992" y="628" text-anchor="middle" class="pcn3-target__value" data-target-value>Not Entered</text>
      </g>
      <path class="pcn3-flow" data-line="normal_to_target" d="M992 534 V572"/>

      <!-- Trace -->
      <g class="pcn3-trace" data-part="trace">
        <rect x="370" y="624" width="450" height="76" rx="14"/>
        <text x="392" y="650" class="pcn3-trace__title">PCN Trace #000127</text>
        <text x="392" y="675" class="pcn3-trace__line" data-trace-text>
          1st: E-D → Wait / Refresh
        </text>
      </g>

      <!-- refresh flag -->
      <g class="pcn3-refresh" data-part="refresh">
        <rect x="52" y="524" width="250" height="70" rx="13"/>
        <text x="177" y="551" text-anchor="middle" class="pcn3-refresh__title">State refreshed</text>
        <text x="177" y="576" text-anchor="middle" class="pcn3-refresh__sub">Downstream_Available = valid</text>
      </g>
    </svg>

    <div class="pcn3__status" data-pcn3-status aria-live="polite">
      多源信号准备进入 PCN
    </div>
  </div>

  <p class="pcn3__note">
    示意：PCN 将多源状态映射到 C / A / E，并从 S / D / B 三类性质形成 9 个判定坐标。
    一个或多个判定坐标被触发后，经 Arbitration 选择相应执行路径；正常执行链成立时进入 Target State。
  </p>
</div>

<script src="{{ "js/pcn-animation.js" | relURL }}" defer></script>
